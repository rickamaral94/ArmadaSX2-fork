# --- Identidade do fork (ArmadaSX2) ---------------------------------------------
#
# O applicationId herdado era `com.armsx2`, do projeto de origem. Publicar assim tem dois
# problemas independentes do nome: no aparelho, mesmo id significa COLISÃO de instalação com o
# ARMSX2; e na gaveta de apps, a identidade exibida seria a deles. Um fork que se distribui
# precisa da própria identidade.
#
# Lido por platforms/android/app/build.gradle.kts, que já expõe esta propriedade — nenhum arquivo
# do upstream precisa ser alterado para trocar de nome.
# ADIADO de propósito: continua `com.armsx2` até a campanha de medição terminar.
#
# Trocar o applicationId faz o Android tratar o app como OUTRO: pasta de dados nova, BIOS,
# memory cards, saves, drivers instalados e configuração do zero. O testador acabou de passar
# por isso uma vez (alpha 3 instalada sobre dados limpos: memory cards recriados, upscale de
# volta a 1.00x, biblioteca vazia) e repetir no meio de uma campanha de medição trocaria dado
# por atrito — justamente quando cada sessão precisa ser comparável com a anterior.
#
# A troca segue sendo a decisão certa e acontece assim que a campanha fechar: id igual ao do
# projeto de origem colide na instalação e exibe a identidade deles. Quando for a hora, é esta
# linha que muda:
#
#   armsx2.applicationId=io.armada.sx2
#
# ...e o testador preserva os dados com:
#
#   adb pull /storage/emulated/0/Android/data/com.armsx2/files backup
#   adb push backup/. /storage/emulated/0/Android/data/io.armada.sx2/files
armsx2.applicationId=com.armsx2
