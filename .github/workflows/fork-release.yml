# Publicação de APK do fork.
#
# Ordem deliberada: CONSTRÓI e só então publica. Um commit que não compila não vira release —
# o job falha antes de existir tag publicada, em vez de deixar uma release vazia ou com um
# artefato velho anexado.
#
# Diferente do CI de push (fork-android-arm64.yml), aqui o alvo é `assembleGithubRelease`:
#
#   * é o build que se mede — o de debug compila o núcleo com -O3 mas SEM LTO, escolha feita
#     para encurtar o ciclo de CI. Comparar driver ou frame generation em um binário que não é
#     o que o usuário roda seria medir outra coisa;
#   * é assinado com a keystore de debug quando não há keystore de Play configurada, e por isso
#     instala no aparelho por sideload. NÃO serve para a Play Store, e não é para lá que vai.
#
# O sabor `github` é o único que habilita o gerenciador de driver customizado e o frame
# generation — que são os dois recursos que este fork existe para exercitar.
name: Fork · Release (APK)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.0-alpha.1)'
        required: true
        type: string
      title:
        description: 'Título da release (vazio = usa a tag)'
        required: false
        type: string
      prerelease:
        description: 'Marcar como pré-lançamento'
        required: false
        type: boolean
        default: true

concurrency:
  group: fork-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Barreira antes de qualquer coisa que produza uma tag. As alphas 21, 22 e 23 quebraram no
  # runner, cada uma num estrato diferente do mesmo merge, e a 23 so foi diagnosticada depois de
  # a 22 ser corrigida: uma cascata de erro de sintaxe esconde o erro semantico embaixo dela.
  # Estas duas verificacoes sao baratas e pegam exatamente os residuos que o compilador nao pega
  # — propriedade duplicada, marcador de conflito, campo que sumiu da serializacao.
  #
  # O job de publicacao depende deste, entao uma tag nao pode nascer com o gate vermelho.
  gate:
    name: Gate de pré-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Consistência de toolchain
        run: python3 tools/fork/check-toolchain.py

      - name: Resíduos de merge
        run: python3 tools/fork/scan-merge-damage.py

  build-and-publish:
    name: APK arm64 · github/release
    needs: gate
    runs-on: ubuntu-24.04
    # LTO + R8 em cima do build nativo inteiro. O CI de debug leva ~33 min; este teto é folgado
    # de propósito, para o job morrer só quando algo estiver de fato errado.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Versões pinadas iguais às do CI de push. Um A/B de driver ou de frame generation não
      # significa nada se o toolchain mudar entre as duas medições.
      # Sem `|| true`: engolir a falha aqui significa compilar o binario PUBLICADO com o NDK
      # que o runner ja tinha, e um binario de toolchain diferente do pinado invalida qualquer
      # comparacao A/B de driver ou de frame generation. A conferencia do diretorio existe
      # porque o sdkmanager ja saiu com codigo 0 sem instalar o que foi pedido.
      - name: Install NDK + CMake
        run: |
          set -euo pipefail
          yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Fetch shaderc third-party deps
        working-directory: platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        # `rustup show` materializa a toolchain que rust-toolchain.toml pina — versao E alvo.
        # Instalar so o alvo deixava a VERSAO do rustc a cargo do runner, e dois builds do mesmo
        # commit podiam embutir um librashader gerado por compiladores diferentes.
        run: rustup show

      # A tag entra como versionName para que o número que aparece no OSD e nos logs seja o
      # mesmo da release. Sem isso, todo relato de teste chegaria dizendo "2.6.1", que é a
      # versão do upstream, e não daria para saber qual build produziu qual medição.
      # Assinatura ESTÁVEL entre releases.
      #
      # Sem isto o Gradle cai em `signingConfigs.debug`, que usa a `~/.android/debug.keystore` do
      # runner — e o runner é descartável, então cada build gera uma chave nova. O Android recusa
      # instalar por cima ("conflito com um pacote já existente") e o usuário perde memory cards,
      # cache de shaders e o driver Turnip a cada atualização. Medido no aparelho, alpha 6 → 7.
      #
      # A chave nunca entra no repositório: vem de segredo, é escrita fora da árvore e apagada
      # depois. Sem o segredo o build continua funcionando, mas AVISA — um alpha que não instala
      # por cima é um problema de distribuição, não um detalhe.
      - name: Materializar keystore de assinatura
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ARMADA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ARMADA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARMADA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARMADA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Assinatura instável::Sem o segredo ARMADA_KEYSTORE_BASE64 o APK é assinado com a keystore de DEBUG do runner, que muda a cada build. Esta release NÃO vai instalar por cima da anterior."
            exit 0
          fi
          for var in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "$(eval "echo \${${var}:-}")" ]; then
              echo "ARMADA_KEYSTORE_BASE64 está definido mas ${var} não. Configure os quatro segredos." >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="${RUNNER_TEMP}/armada-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

          # O Gradle lê este arquivo em rootProject (platforms/android). Não é commitado: existe
          # só dentro do runner e some com ele.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${KEYSTORE_PATH}" "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" \
            > platforms/android/armsx2_keystore.properties
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK (github flavor, arm64-v8a)
        working-directory: platforms/android
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          ./gradlew :app:assembleGithubRelease --stacktrace "-Parmsx2.versionName=${VERSION}"

      - name: Locate and name the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find platforms/android/app/build/outputs/apk -name '*.apk' -type f -print -quit)"
          if [ -z "${APK}" ]; then
            echo "nenhum APK produzido pelo build" >&2
            find platforms/android/app/build/outputs -type f >&2 || true
            exit 1
          fi
          OUT="armadasx2-${{ inputs.tag }}-android-arm64.apk"
          cp "${APK}" "${OUT}"
          # SHA-256 pelo mesmo motivo que o registramos para pacotes de driver: é IDENTIDADE.
          # Um relato de compatibilidade que diz "alpha 1" não distingue dois builds com o mesmo
          # nome; o hash distingue.
          SHA="$(sha256sum "${OUT}" | cut -d' ' -f1)"
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "${OUT}" | cut -f1)" >> "$GITHUB_OUTPUT"

      # A chave sai do disco assim que o APK está assinado, mesmo se um passo seguinte falhar.
      - name: Apagar a keystore do runner
        if: always()
        run: |
          rm -f "${KEYSTORE_PATH:-}" platforms/android/armsx2_keystore.properties || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="${{ inputs.title }}"
          [ -n "${TITLE}" ] || TITLE="${{ inputs.tag }}"

          {
            echo "APK arm64, sabor \`github\`, build de release (LTO + R8). Instala por sideload,"
            echo "**não** serve para a Play Store."
            echo
            if [ "${{ steps.signing.outputs.stable }}" = "true" ]; then
              echo "Assinado com a chave estável do fork: **instala por cima da release anterior**,"
              echo "preservando memory cards, configurações e cache de shaders."
            else
              echo "> **Atenção:** assinado com a keystore de debug do runner, que muda a cada build."
              echo "> Esta versão **não instala por cima** da anterior — é preciso desinstalar antes,"
              echo "> e a desinstalação apaga \`Android/data/com.armsx2/files/\` (memory cards,"
              echo "> configurações, cache de shaders e drivers). Faça backup dessa pasta primeiro."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| SHA-256 do APK | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| tamanho | ${{ steps.apk.outputs.size }} |"
            echo
            echo "O SHA-256 está aqui porque um relato de teste que diz apenas o nome da versão não"
            echo "distingue dois builds. Ao reportar uma medição, cite-o."
          } > release-notes.md

          gh release create "${{ inputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --title "${TITLE}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}" \
            ${{ inputs.prerelease && '--prerelease' || '' }}
